services:
  bank-agent:
    build: .
    container_name: bank-agent
    ports:
      - "8080:8080"
    environment:
      # 密钥从执行 docker compose 命令的终端环境读取（或同目录 .env 文件）
      - ZHIPUAGENT_API_KEY=${ZHIPUAGENT_API_KEY}
      - RUN_LLM_EVAL=false
    volumes:
      # 向量库落盘持久化：容器重建不丢数据
      - ./data:/app/data
    restart: unless-stopped
