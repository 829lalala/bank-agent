<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星辰小助手 · 企业智能业务助手</title>
    <style>
      /* ============================================================
         设计主题：简约大气
         白/灰双色阶 + 近黑强调色，去掉一切装饰元素，
         层次全靠留白、字重与柔和阴影表达。深色模式自动适配。
         ============================================================ */
      :root {
        --bg: #f7f7f8;
        --card: #ffffff;
        --ink: #17181c;
        --muted: #9b9ea6;
        --line: #e8e8ea;
        --hover: #efeff1;
        --user-bubble: #1c1d22;
        --ai-bubble: var(--card);
        --cite-bg: #f0f0f2;
        --danger: #d4494f;
        --shadow-sm: 0 1px 2px rgba(23, 24, 28, 0.04);
        --shadow-md: 0 4px 20px rgba(23, 24, 28, 0.07);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101012;
          --card: #1a1a1e;
          --ink: #ececee;
          --muted: #77787f;
          --line: #2a2a2f;
          --hover: #232328;
          --user-bubble: #e9e9ec;
          --ai-bubble: var(--card);
          --cite-bg: #26262b;
          --danger: #e07b7f;
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.45);
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        height: 100%;
        height: 100dvh; /* 动态视口高：iOS Safari 地址栏收展时输入区不被裁掉，旧浏览器回退 100% */
        display: flex;
        flex-direction: column;
      }

      /* ---- 顶栏：与背景同色，仅一条细线 ---- */
      header {
        padding: 16px 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--bg);
      }
      header .title {
        font-size: 15px;
        font-weight: 600;
      }
      header .subtitle {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--muted);
      }
      .status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #34a853;
        animation: pulse 2.4s infinite;
      }
      @media (prefers-color-scheme: dark) {
        .status .dot {
          background: #4ade80;
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      /* ---- 消息区 ---- */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 32px 20px 12px;
        scroll-behavior: smooth;
      }
      #messages::-webkit-scrollbar {
        width: 8px;
      }
      #messages::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
      }
      #messages::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }
      .inner {
        max-width: 720px;
        margin: 0 auto;
      }
      .msg {
        margin-bottom: 24px;
        display: flex;
        gap: 12px;
        align-items: flex-end;
        animation: rise 0.25s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      .msg.user {
        flex-direction: row-reverse;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
      }
      .msg.ai .avatar {
        background: var(--ink);
        color: var(--bg);
      }
      .msg.user .avatar {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .bubble-wrap {
        max-width: 76%;
      }
      .bubble {
        padding: 13px 17px;
        border-radius: 18px;
        line-height: 1.8;
        font-size: 15px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.ai .bubble {
        background: var(--ai-bubble);
        color: var(--ink);
        border: 1px solid var(--line);
        border-bottom-left-radius: 6px;
        box-shadow: var(--shadow-sm);
      }
      .msg.user .bubble {
        background: var(--user-bubble);
        color: var(--bg);
        border-bottom-right-radius: 6px;
      }
      @media (prefers-color-scheme: dark) {
        .msg.user .bubble {
          color: #101012;
        }
      }
      .time {
        font-size: 11px;
        color: var(--muted);
        margin: 6px 4px 0;
      }
      .msg.user .time {
        text-align: right;
      }

      /* 来源标注：极简灰底 */
      .cite {
        display: inline-block;
        font-size: 11px;
        color: var(--muted);
        background: var(--cite-bg);
        border-radius: 5px;
        padding: 1px 8px;
        margin: 0 2px;
        line-height: 18px;
        vertical-align: 1px;
      }

      /* 思考中动画 */
      .typing {
        display: inline-flex;
        gap: 5px;
        padding: 6px 2px;
      }
      .typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        animation: bounce 1.2s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        30% {
          transform: translateY(-4px);
          background: var(--ink);
        }
      }

      /* 打字光标 */
      .cursor {
        display: inline-block;
        width: 2px;
        height: 15px;
        background: var(--ink);
        vertical-align: -2px;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* ---- 欢迎屏 ---- */
      #welcome {
        text-align: center;
        padding: 88px 20px 10px;
        animation: rise 0.4s ease-out;
      }
      #welcome h1 {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin-bottom: 12px;
      }
      #welcome p {
        font-size: 14.5px;
        color: var(--muted);
        margin-bottom: 44px;
        line-height: 1.7;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        max-width: 560px;
        margin: 0 auto;
      }
      .chip {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 11px 18px;
        border-radius: 999px;
        font-size: 13.5px;
        cursor: pointer;
        transition: all 0.18s ease;
        font-family: inherit;
      }
      .chip:hover {
        background: var(--card);
        border-color: var(--muted);
        box-shadow: var(--shadow-sm);
      }
      .chip:active {
        transform: scale(0.98);
      }

      /* ---- 输入区 ---- */
      footer {
        padding: 14px 20px 18px;
        background: var(--bg);
      }
      .input-bar {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 11px 12px 11px 17px;
        box-shadow: var(--shadow-md);
        transition: border-color 0.18s;
      }
      .input-bar:focus-within {
        border-color: var(--muted);
      }
      #input {
        flex: 1;
        border: none;
        outline: none;
        resize: none;
        font-size: 15px;
        line-height: 1.6;
        max-height: 132px;
        font-family: inherit;
        background: transparent;
        color: var(--ink);
        /* 上下 8px 与发送按钮等高：单行时文字基线对齐（按钮 39px ≈ 24px 行高 + 16px 内边距） */
        padding: 8px 0;
        overflow-y: auto;
        scrollbar-width: none; /* Firefox：隐藏滚动条 UI（滚轮/键盘仍可滚动） */
      }
      #input::-webkit-scrollbar {
        display: none; /* Chrome/Edge：隐藏滚动条，消除占位文字换行时出现的上下箭头按钮 */
      }
      #input::placeholder {
        color: var(--muted);
      }
      #send,
      #stop {
        border: none;
        border-radius: 11px;
        padding: 9px 18px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.18s;
        flex-shrink: 0;
        font-family: inherit;
      }
      #send {
        background: var(--ink);
        color: var(--bg);
      }
      #send:disabled {
        background: var(--line);
        color: var(--muted);
        cursor: not-allowed;
      }
      #send:not(:disabled):hover {
        opacity: 0.85;
      }
      #stop {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--danger);
        display: none;
      }
      #stop:hover {
        background: var(--hover);
      }
      .tip {
        text-align: center;
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 9px;
      }

      /* ---- 响应式：平板与窄窗口（≤560px）---- */
      @media (max-width: 560px) {
        #messages {
          padding: 16px 14px 8px;
        }
        .msg {
          margin-bottom: 16px;
          gap: 9px;
        }
        .bubble-wrap {
          max-width: 84%;
        }
        .bubble {
          padding: 11px 14px;
          font-size: 14.5px;
        }
        #welcome {
          padding: 44px 16px 8px;
        }
        #welcome h1 {
          font-size: 24px;
        }
        #welcome p {
          margin-bottom: 30px;
        }
        .chips {
          gap: 8px;
        }
        .chip {
          padding: 10px 15px;
          font-size: 13px;
        }
        /* iOS Safari：聚焦字号 <16px 会强制页面缩放，触屏设备提到 16px 避免 */
        @media (hover: none) and (pointer: coarse) {
          #input {
            font-size: 16px;
          }
        }
      }

      /* ---- 响应式：窄手机屏（≤480px）---- */
      @media (max-width: 480px) {
        header {
          padding: 13px 16px;
        }
        header .subtitle {
          display: none; /* 长副标题在窄屏隐藏，避免换行挤压顶栏 */
        }
        .status .status-text {
          display: none; /* 状态只留呼吸灯点 */
        }
        footer {
          padding: 10px 12px 14px;
        }
      }

      /* ---- 响应式：横屏矮窗口 ---- */
      @media (max-height: 520px) {
        #welcome {
          padding: 20px 16px 8px;
        }
        #welcome h1 {
          font-size: 20px;
          margin-bottom: 6px;
        }
        #welcome p {
          margin-bottom: 16px;
        }
        .msg {
          margin-bottom: 12px;
        }
      }

      /* 无障碍：跟随系统减弱动效 */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        #messages {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">星</div>
      <div>
        <div class="title">星辰小助手</div>
        <div class="subtitle">
          企业级智能业务助手 · RAG + 工具调用 + 多轮记忆
        </div>
      </div>
      <div class="status">
        <span class="dot"></span><span class="status-text">在线</span>
      </div>
    </header>

    <div id="messages">
      <div class="inner">
        <div id="welcome">
          <h1>你好，我是星辰小助手</h1>
          <p>查询产品知识、查余额、算利息——试试下面的例子，或直接输入问题</p>
          <div class="chips">
            <button class="chip" onclick="quickAsk(this)">
              大额存单的起购金额是多少？
            </button>
            <button class="chip" onclick="quickAsk(this)">
              查一下张三的账户余额
            </button>
            <button class="chip" onclick="quickAsk(this)">
              存5万元两年定期利息是多少？
            </button>
            <button class="chip" onclick="quickAsk(this)">
              白金信用卡有什么权益？
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="input-bar">
        <textarea id="input" rows="1" placeholder="输入你的问题…"></textarea>
        <button id="send">发送</button>
        <button id="stop">■ 停止</button>
      </div>
      <div class="tip">
        内容由 AI 生成，产品信息以本行官方公告为准 · Enter 发送 / Shift+Enter
        换行
      </div>
    </footer>

    <script>
      const messages = document.getElementById("messages");
      const inner = messages.querySelector(".inner");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const stopBtn = document.getElementById("stop");

      // 会话 ID：同一浏览器会话内复用，保证多轮记忆生效
      let conversationId = sessionStorage.getItem("convId");
      if (!conversationId) {
        conversationId = crypto.randomUUID();
        sessionStorage.setItem("convId", conversationId);
      }

      let controller = null; // 用于"停止生成"

      function now() {
        const d = new Date();
        return (
          String(d.getHours()).padStart(2, "0") +
          ":" +
          String(d.getMinutes()).padStart(2, "0")
        );
      }

      function hideWelcome() {
        const w = document.getElementById("welcome");
        if (w) w.remove();
      }

      // 追加一条消息，返回气泡元素（供流式追加）
      function addMessage(role) {
        hideWelcome();
        const div = document.createElement("div");
        div.className = "msg " + role;
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "ai" ? "星" : "我";
        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const time = document.createElement("div");
        time.className = "time";
        time.textContent = now();
        wrap.appendChild(bubble);
        wrap.appendChild(time);
        div.appendChild(avatar);
        div.appendChild(wrap);
        inner.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return bubble;
      }

      function scrollBottom() {
        messages.scrollTop = messages.scrollHeight;
      }

      // "思考中"指示器
      function addTyping() {
        hideWelcome();
        const div = document.createElement("div");
        div.className = "msg ai";
        div.id = "typing";
        div.innerHTML =
          '<div class="avatar">星</div>' +
          '<div class="bubble-wrap"><div class="bubble"><span class="typing">' +
          "<span></span><span></span><span></span></span></div></div>";
        inner.appendChild(div);
        scrollBottom();
      }
      function removeTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
      }

      // 安全美化：先 HTML 转义，再把"（依据：资料N）"转成标签样式
      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function beautify(text) {
        return escapeHtml(text)
          .replace(/（依据：([^）]+)）/g, '<span class="cite">$1</span>')
          .replace(/\n/g, "<br>");
      }

      async function sendMessage(text) {
        const q = (text || input.value).trim();
        if (!q || controller) return;
        input.value = "";
        autoGrow();
        sendBtn.disabled = true;
        sendBtn.style.display = "none";
        stopBtn.style.display = "inline-block";
        addMessage("user").textContent = q;
        addTyping();

        controller = new AbortController();
        const aiBubble = addMessage("ai");
        aiBubble.innerHTML = '<span class="cursor"></span>';
        let first = true;

        try {
          const resp = await fetch(
            "/agent/chat?q=" +
              encodeURIComponent(q) +
              "&conversationId=" +
              encodeURIComponent(conversationId),
            { signal: controller.signal },
          );
          if (!resp.ok) throw new Error("HTTP " + resp.status);

          const reader = resp.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "",
            full = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const events = buffer.split("\n\n");
            buffer = events.pop();
            for (const e of events) {
              const line = e.trim();
              if (line.startsWith("data:")) {
                if (first) {
                  removeTyping();
                  first = false;
                }
                full += line.slice(5);
                aiBubble.textContent = full + " ▍"; // 流式期间追加原文 + 光标
                scrollBottom();
              }
            }
          }
          // 流结束：整体美化（来源标注转 pill 样式）
          removeTyping();
          aiBubble.innerHTML =
            beautify(full) || '<span style="color:#9b9ea6">（空响应）</span>';
          scrollBottom();
        } catch (err) {
          removeTyping();
          if (err.name === "AbortError") {
            aiBubble.innerHTML =
              beautify(full) + '<span class="cite">已停止</span>';
          } else {
            aiBubble.innerHTML =
              '<span style="color:#d4494f">请求失败：' +
              escapeHtml(err.message) +
              "，请确认后端已启动</span>";
          }
        } finally {
          if (controller) {
            controller.abort();
          } // 流已结束，主动清理底层连接，消除控制台 ERR_ABORTED 噪音
          controller = null;
          sendBtn.disabled = false;
          sendBtn.style.display = "inline-block";
          stopBtn.style.display = "none";
          input.focus();
        }
      }

      // 输入框高度自适应（132px ≈ CSS max-height，两处保持同步）
      function autoGrow() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 132) + "px";
      }

      function quickAsk(btn) {
        if (controller) return;
        sendMessage(btn.textContent);
      }

      sendBtn.addEventListener("click", () => sendMessage());
      stopBtn.addEventListener("click", () => controller && controller.abort());
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      input.addEventListener("input", autoGrow);
      input.focus();
    </script>
  </body>
</html>
