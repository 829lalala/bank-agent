<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业智能业务助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            display: flex; flex-direction: column;
            height: 100vh; max-width: 800px; margin: 0 auto;
        }
        header {
            background: #1a5fb4; color: #fff;
            padding: 16px; text-align: center; font-size: 18px;
        }
        /* 消息滚动区：内容超出时自动出现滚动条 */
        #messages { flex: 1; overflow-y: auto; padding: 16px; }
        .msg { margin-bottom: 12px; display: flex; }
        .msg.user { justify-content: flex-end; }
        .bubble {
            max-width: 75%; padding: 10px 14px; border-radius: 12px;
            line-height: 1.6; white-space: pre-wrap; word-break: break-word;
        }
        .msg.user .bubble { background: #1a5fb4; color: #fff; border-bottom-right-radius: 2px; }
        .msg.ai   .bubble { background: #fff; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
        /* 输入区 */
        footer { display: flex; padding: 12px; gap: 8px; background: #fff; }
        #input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        #send {
            padding: 10px 20px; border: none; border-radius: 8px;
            background: #1a5fb4; color: #fff; cursor: pointer;
        }
        #send:disabled { background: #999; cursor: not-allowed; }
    </style>
</head>
<body>
<header>企业智能业务助手</header>
<div id="messages"></div>
<footer>
    <input id="input" placeholder="输入问题，回车发送..." autofocus>
    <button id="send">发送</button>
</footer>

<script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addBubble(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        div.appendChild(bubble);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight; // 自动滚到底部
        return bubble;
    }

    async function sendMessage() {
        const q = input.value.trim();
        if (!q) return;
        input.value = '';
        sendBtn.disabled = true;
        addBubble('user', q);
        const aiBubble = addBubble('ai', ''); // 先占位，流式内容往里追加

        try {
            // fetch 发起流式请求：响应体是 ReadableStream，可边到边读
            const resp = await fetch('/chat/stream?q=' + encodeURIComponent(q));
            if (!resp.ok) throw new Error('HTTP ' + resp.status);

            const reader = resp.body.getReader();
            const decoder = new TextDecoder('utf-8'); // 字节流转文本
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                // SSE 事件之间以空行（\n\n）分隔；每行形如 "data:xxx"
                const events = buffer.split('\n\n');
                buffer = events.pop(); // 最后一段可能不完整，留到下一轮
                for (const e of events) {
                    const line = e.trim();
                    if (line.startsWith('data:')) {
                        aiBubble.textContent += line.slice(5); // 去掉 "data:" 前缀，追加文本
                        messages.scrollTop = messages.scrollHeight;
                    }
                }
            }
        } catch (err) {
            aiBubble.textContent += '\n[出错了: ' + err.message + ']';
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
