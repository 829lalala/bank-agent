<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星辰小助手 · 企业智能业务助手</title>
    <style>
      /* ============================================================
         设计主题：私人银行年报质感
         象牙暖白纸感底 + 深藏青主色 + 金铜点缀 + 衬线标题
         全部颜色收敛为 CSS 变量，深色模式经 prefers-color-scheme 自动适配
         ============================================================ */
      :root {
        --bg: #f6f3ec; /* 象牙暖白（纸感底） */
        --card: #fffdf8;
        --ink: #22303f; /* 正文墨色 */
        --muted: #8d95a1;
        --navy: #16324f; /* 主深藏青 */
        --navy-deep: #0e2438;
        --brass: #a8854f; /* 金铜点缀 */
        --brass-soft: #c9ab77;
        --line: #e6ddcc; /* 暖调细边框 */
        --user-bubble: linear-gradient(135deg, #1d3d5f, #16324f);
        --ai-bubble: var(--card);
        --cite-bg: #f4ede0;
        --danger: #b3491f;
        --header-grad: linear-gradient(
          120deg,
          #0e2438 0%,
          #16324f 55%,
          #1d4064 100%
        );
        --shadow-sm:
          0 1px 2px rgba(34, 48, 63, 0.05), 0 1px 6px rgba(34, 48, 63, 0.04);
        --shadow-md:
          0 2px 6px rgba(34, 48, 63, 0.06), 0 8px 24px rgba(34, 48, 63, 0.07);
        --serif:
          "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
      }
      /* 深色模式：跟随系统 */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1722;
          --card: #16212e;
          --ink: #e8e3d8;
          --muted: #7e8996;
          --navy: #24425f;
          --navy-deep: #0c1826;
          --brass: #c9a86c;
          --brass-soft: #a8854f;
          --line: #263546;
          --user-bubble: linear-gradient(135deg, #1d3d5f, #17334f);
          --ai-bubble: var(--card);
          --cite-bg: #2a2620;
          --header-grad: linear-gradient(
            120deg,
            #0a1420 0%,
            #12283e 55%,
            #1a3a58 100%
          );
          --shadow-sm:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 6px rgba(0, 0, 0, 0.25);
          --shadow-md:
            0 2px 6px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.3);
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ---- 顶栏：深藏青 + 金铜细饰 ---- */
      header {
        background: var(--header-grad);
        color: #f3ede1;
        padding: 14px 22px;
        display: flex;
        align-items: center;
        gap: 13px;
        border-bottom: 1px solid rgba(200, 171, 119, 0.35);
        box-shadow: 0 2px 12px rgba(14, 36, 56, 0.25);
      }
      .logo {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: linear-gradient(150deg, #d8b87e, #a8854f);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--serif);
        font-size: 21px;
        font-weight: 700;
        color: #0e2438;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.45),
          0 2px 8px rgba(0, 0, 0, 0.3);
      }
      header .title {
        font-family: var(--serif);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      header .subtitle {
        font-size: 12px;
        opacity: 0.72;
        margin-top: 3px;
        letter-spacing: 0.02em;
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        border: 1px solid rgba(200, 171, 119, 0.4);
        background: rgba(200, 171, 119, 0.12);
        padding: 4px 12px;
        border-radius: 999px;
        letter-spacing: 0.05em;
      }
      .status .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #7fbf8e;
        box-shadow: 0 0 6px rgba(127, 191, 142, 0.8);
        animation: pulse 2.4s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }

      /* ---- 消息区 ---- */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 26px 20px 12px;
        scroll-behavior: smooth;
      }
      /* 细滚动条（暖灰） */
      #messages::-webkit-scrollbar {
        width: 8px;
      }
      #messages::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
      }
      #messages::-webkit-scrollbar-thumb:hover {
        background: var(--brass-soft);
      }
      .inner {
        max-width: 780px;
        margin: 0 auto;
      }
      .msg {
        margin-bottom: 18px;
        display: flex;
        gap: 11px;
        align-items: flex-end;
        animation: rise 0.32s cubic-bezier(0.22, 0.9, 0.36, 1);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .msg.user {
        flex-direction: row-reverse;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--serif);
        font-size: 15px;
        font-weight: 700;
      }
      .msg.ai .avatar {
        background: linear-gradient(150deg, #d8b87e, #a8854f);
        color: #0e2438;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      .msg.user .avatar {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-family: inherit;
      }
      .bubble-wrap {
        max-width: 78%;
      }
      .bubble {
        padding: 13px 17px;
        border-radius: 14px;
        line-height: 1.78;
        font-size: 14.5px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.ai .bubble {
        background: var(--ai-bubble);
        color: var(--ink);
        border: 1px solid var(--line);
        border-bottom-left-radius: 4px;
        box-shadow: var(--shadow-sm);
        position: relative;
      }
      /* AI 气泡左缘金线：年报页签质感 */
      .msg.ai .bubble::before {
        content: "";
        position: absolute;
        left: 0;
        top: 10px;
        bottom: 10px;
        width: 2px;
        border-radius: 1px;
        background: linear-gradient(to bottom, var(--brass), transparent);
        opacity: 0.55;
      }
      .msg.user .bubble {
        background: var(--user-bubble);
        color: #f3ede1;
        border-bottom-right-radius: 4px;
        box-shadow: var(--shadow-sm);
        letter-spacing: 0.01em;
      }
      .time {
        font-size: 11px;
        color: var(--muted);
        margin: 5px 4px 0;
        letter-spacing: 0.04em;
      }
      .msg.user .time {
        text-align: right;
      }

      /* 来源标注：金铜衬线页签 */
      .cite {
        display: inline-block;
        font-size: 11px;
        font-family: var(--serif);
        color: var(--brass);
        background: var(--cite-bg);
        border: 1px solid var(--brass-soft);
        border: 1px solid color-mix(in srgb, var(--brass) 35%, transparent);
        border-radius: 4px;
        padding: 0 7px;
        margin: 0 2px;
        line-height: 18px;
        vertical-align: 1px;
        letter-spacing: 0.03em;
      }

      /* 思考中动画 */
      .typing {
        display: inline-flex;
        gap: 5px;
        padding: 6px 2px;
      }
      .typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--brass-soft);
        animation: bounce 1.2s infinite;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        30% {
          transform: translateY(-5px);
          background: var(--brass);
        }
      }

      /* 打字光标：金色 */
      .cursor {
        display: inline-block;
        width: 2px;
        height: 15px;
        background: var(--brass);
        vertical-align: -2px;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* ---- 欢迎屏 ---- */
      #welcome {
        text-align: center;
        padding: 56px 20px 10px;
        animation: rise 0.5s ease;
      }
      #welcome .big-logo {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        margin: 0 auto 20px;
        background: linear-gradient(150deg, #d8b87e, #a8854f);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--serif);
        font-size: 34px;
        color: #0e2438;
        font-weight: 700;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          0 8px 24px rgba(168, 133, 79, 0.3);
      }
      #welcome h1 {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--ink);
        margin-bottom: 10px;
      }
      #welcome .divider {
        width: 46px;
        height: 2px;
        margin: 0 auto 14px;
        background: linear-gradient(
          to right,
          transparent,
          var(--brass),
          transparent
        );
      }
      #welcome p {
        font-size: 13.5px;
        color: var(--muted);
        margin-bottom: 28px;
        letter-spacing: 0.02em;
      }
      .chips-label {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.28em;
        margin-bottom: 14px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        max-width: 600px;
        margin: 0 auto;
      }
      .chip {
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 11px 17px;
        border-radius: 10px;
        font-size: 13.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-sm);
        position: relative;
        font-family: inherit;
      }
      /* 左缘金点：hover 时点亮 */
      .chip::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--line);
        margin-right: 9px;
        vertical-align: 2px;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      .chip:hover {
        border-color: var(--brass);
        color: var(--navy);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      @media (prefers-color-scheme: dark) {
        .chip:hover {
          color: var(--brass);
        }
      }
      .chip:hover::before {
        background: var(--brass);
        box-shadow: 0 0 6px rgba(168, 133, 79, 0.6);
      }

      /* ---- 输入区 ---- */
      footer {
        padding: 14px 20px 18px;
        background: var(--bg);
      }
      .input-bar {
        max-width: 780px;
        margin: 0 auto;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 11px 13px;
        box-shadow: var(--shadow-md);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .input-bar:focus-within {
        border-color: var(--brass);
        box-shadow: var(--shadow-md);
        box-shadow:
          var(--shadow-md),
          0 0 0 3px color-mix(in srgb, var(--brass) 14%, transparent);
      }
      #input {
        flex: 1;
        border: none;
        outline: none;
        resize: none;
        font-size: 14.5px;
        line-height: 1.6;
        max-height: 120px;
        font-family: inherit;
        background: transparent;
        color: var(--ink);
      }
      #input::placeholder {
        color: var(--muted);
      }
      #send,
      #stop {
        border: none;
        border-radius: 9px;
        padding: 9px 20px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
        flex-shrink: 0;
        letter-spacing: 0.08em;
        font-family: inherit;
      }
      #send {
        background: var(--navy);
        color: #f3ede1;
        border: 1px solid var(--navy-deep);
      }
      #send:disabled {
        background: var(--line);
        border-color: var(--line);
        color: var(--muted);
        cursor: not-allowed;
      }
      #send:not(:disabled):hover {
        background: var(--navy-deep);
      }
      #stop {
        background: transparent;
        border: 1px solid var(--danger);
        color: var(--danger);
        display: none;
      }
      #stop:hover {
        background: color-mix(in srgb, var(--danger) 10%, transparent);
      }
      .tip {
        text-align: center;
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 9px;
        letter-spacing: 0.03em;
      }

      /* 无障碍：跟随系统减弱动效 */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
        #messages {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">星</div>
      <div>
        <div class="title">星辰小助手</div>
        <div class="subtitle">
          企业级智能业务助手 · RAG + 工具调用 + 多轮记忆
        </div>
      </div>
      <div class="status"><span class="dot"></span>在线</div>
    </header>

    <div id="messages">
      <div class="inner">
        <div id="welcome">
          <div class="big-logo">星</div>
          <h1>你好，我是星辰小助手</h1>
          <div class="divider"></div>
          <p>
            我可以查询本行产品知识、帮你查余额、算利息——试试下面的例子，或直接输入问题
          </p>
          <div class="chips-label">试 试 这 些</div>
          <div class="chips">
            <button class="chip" onclick="quickAsk(this)">
              大额存单的起购金额是多少？
            </button>
            <button class="chip" onclick="quickAsk(this)">
              查一下张三的账户余额
            </button>
            <button class="chip" onclick="quickAsk(this)">
              存5万元两年定期利息是多少？
            </button>
            <button class="chip" onclick="quickAsk(this)">
              白金信用卡有什么权益？
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="input-bar">
        <textarea
          id="input"
          rows="1"
          placeholder="输入问题，Enter 发送 / Shift+Enter 换行"
        ></textarea>
        <button id="send">发送</button>
        <button id="stop">■ 停止</button>
      </div>
      <div class="tip">
        内容由 AI 生成，产品信息以本行官方公告为准 · Enter 发送 / Shift+Enter
        换行
      </div>
    </footer>

    <script>
      const messages = document.getElementById("messages");
      const inner = messages.querySelector(".inner");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const stopBtn = document.getElementById("stop");

      // 会话 ID：同一浏览器会话内复用，保证多轮记忆生效
      let conversationId = sessionStorage.getItem("convId");
      if (!conversationId) {
        conversationId = crypto.randomUUID();
        sessionStorage.setItem("convId", conversationId);
      }

      let controller = null; // 用于"停止生成"

      function now() {
        const d = new Date();
        return (
          String(d.getHours()).padStart(2, "0") +
          ":" +
          String(d.getMinutes()).padStart(2, "0")
        );
      }

      function hideWelcome() {
        const w = document.getElementById("welcome");
        if (w) w.remove();
      }

      // 追加一条消息，返回气泡元素（供流式追加）
      function addMessage(role) {
        hideWelcome();
        const div = document.createElement("div");
        div.className = "msg " + role;
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = role === "ai" ? "星" : "我";
        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const time = document.createElement("div");
        time.className = "time";
        time.textContent = now();
        wrap.appendChild(bubble);
        wrap.appendChild(time);
        div.appendChild(avatar);
        div.appendChild(wrap);
        inner.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return bubble;
      }

      function scrollBottom() {
        messages.scrollTop = messages.scrollHeight;
      }

      // "思考中"指示器
      function addTyping() {
        hideWelcome();
        const div = document.createElement("div");
        div.className = "msg ai";
        div.id = "typing";
        div.innerHTML =
          '<div class="avatar">星</div>' +
          '<div class="bubble-wrap"><div class="bubble"><span class="typing">' +
          "<span></span><span></span><span></span></span></div></div>";
        inner.appendChild(div);
        scrollBottom();
      }
      function removeTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
      }

      // 安全美化：先 HTML 转义，再把"（依据：资料N）"转成标签样式
      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function beautify(text) {
        return escapeHtml(text)
          .replace(/（依据：([^）]+)）/g, '<span class="cite">◈ $1</span>')
          .replace(/\n/g, "<br>");
      }

      async function sendMessage(text) {
        const q = (text || input.value).trim();
        if (!q || controller) return;
        input.value = "";
        autoGrow();
        sendBtn.disabled = true;
        sendBtn.style.display = "none";
        stopBtn.style.display = "inline-block";
        addMessage("user").textContent = q;
        addTyping();

        controller = new AbortController();
        const aiBubble = addMessage("ai");
        aiBubble.innerHTML = '<span class="cursor"></span>';
        let first = true;

        try {
          const resp = await fetch(
            "/agent/chat?q=" +
              encodeURIComponent(q) +
              "&conversationId=" +
              encodeURIComponent(conversationId),
            { signal: controller.signal },
          );
          if (!resp.ok) throw new Error("HTTP " + resp.status);

          const reader = resp.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let buffer = "",
            full = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const events = buffer.split("\n\n");
            buffer = events.pop();
            for (const e of events) {
              const line = e.trim();
              if (line.startsWith("data:")) {
                if (first) {
                  removeTyping();
                  first = false;
                }
                full += line.slice(5);
                aiBubble.textContent = full + " ▍"; // 流式期间追加原文 + 光标
                scrollBottom();
              }
            }
          }
          // 流结束：整体美化（来源标注转 pill 样式）
          removeTyping();
          aiBubble.innerHTML =
            beautify(full) || '<span style="color:#8d95a1">（空响应）</span>';
          scrollBottom();
        } catch (err) {
          removeTyping();
          if (err.name === "AbortError") {
            aiBubble.innerHTML =
              beautify(full) + '<span class="cite">已停止</span>';
          } else {
            aiBubble.innerHTML =
              '<span style="color:#b3491f">请求失败：' +
              escapeHtml(err.message) +
              "，请确认后端已启动</span>";
          }
        } finally {
          if (controller) {
            controller.abort();
          } // 流已结束，主动清理底层连接，消除控制台 ERR_ABORTED 噪音
          controller = null;
          sendBtn.disabled = false;
          sendBtn.style.display = "inline-block";
          stopBtn.style.display = "none";
          input.focus();
        }
      }

      // 输入框高度自适应
      function autoGrow() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
      }

      function quickAsk(btn) {
        if (controller) return;
        sendMessage(btn.textContent);
      }

      sendBtn.addEventListener("click", () => sendMessage());
      stopBtn.addEventListener("click", () => controller && controller.abort());
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      input.addEventListener("input", autoGrow);
      input.focus();
    </script>
  </body>
</html>
