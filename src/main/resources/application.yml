# 应用配置文件（YAML 格式：用缩进表示层级，注意冒号后有一个空格）
spring:
  application:
    name: bank-agent # 应用名，会显示在日志和监控中
  sql:
    init:
      # 启动时执行 classpath: schema.sql（建向量表，幂等）。
      # 默认 EMBEDDED 只对外接库跳过——外接 PostgreSQL 必须显式 ALWAYS
      mode: always
  datasource:
    # PostgreSQL（带 pgvector 扩展）：向量库、会话记忆、长期画像三者共用的持久化库。
    # 本地开发用 docker 起容器：docker run -d --name bank-agent-pg
    #   -e POSTGRES_PASSWORD=bankagent -e POSTGRES_DB=bankagent -p 5432:5432 pgvector/pgvector:pg16
    url: jdbc:postgresql://localhost:5432/bankagent
    username: postgres
    password: bankagent
  ai:
    vectorstore:
      pgvector:
        # 向量维度必须与 embedding 模型输出一致（智谱 embedding-3 = 2048 维，
        # 实测自落盘向量），不匹配会导致入库失败或检索精度归零。
        # 注：2.0 版建表由 PgVectorStore 启动时自动完成，无 initialize-schema 开关
        dimensions: 2048
    chat:
      memory:
        repository:
          jdbc:
            # 会话记忆表（AI_CHAT_MEMORY）建表模式：值是 DatabaseInitializationMode
            # 枚举（ALWAYS/EMBEDDED/NEVER），不是布尔——默认 EMBEDDED 只对内嵌库生效，
            # 外接 PostgreSQL 必须显式 ALWAYS（javap 反编译 Properties 类确认）
            initialize-schema: ALWAYS
    mcp:
      server:
        # MCP 服务标识：客户端连接后看到的名称与版本
        name: bank-agent-mcp
        version: 0.0.1
    openai:
      # 智谱开放平台的 OpenAI 兼容端点。
      # 拼接规则：Spring AI 2.0 会在此地址后自动追加 /chat/completions，
      # 最终请求 https://open.bigmodel.cn/api/paas/v4/chat/completions
      base-url: https://open.bigmodel.cn/api/paas/v4
      # API 密钥从环境变量 ZHIPUAGENT_API_KEY 读取（密钥不能提交到代码仓库）。
      # 冒号后是默认值：未设置环境变量时报错信息里会显示这段提示文字。
      api-key: ${ZHIPUAGENT_API_KEY:请设置环境变量ZHIPUAGENT_API_KEY}
      chat:
        # 模型名：glm-4-flash 为智谱免费模型，适合学习调试；
        # glm-4-plus 为更强模型（提示词遵循度更好，计费）——
        # 实测长期画像注入在 flash 下会被无视（记住但反问），plus 下完全遵循，
        # 面试演示长期记忆时建议临时切换 plus，对比结论见 docs/interview-qa-handbook.md
        model: glm-4-flash
        # 温度参数：0~1，越高回答越随机有创意，越低越稳定确定。
        # 银行业务场景追求稳定，通常设低一些
        temperature: 0.7
      embedding:
        # 向量化模型（RAG 用）：把文本转成向量。同样是 OpenAI 兼容属性，
        # base-url 和 api-key 自动继承上面的全局配置
        model: embedding-3
